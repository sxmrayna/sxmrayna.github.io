<figure class="coaching-product-demo" aria-labelledby="coaching-demo-caption">
  <figcaption id="coaching-demo-caption">
    <span class="coaching-demo-label">Conceptual interface · fictional example</span>
    <strong>A conversation with room to think.</strong>
  </figcaption>
  <div class="coaching-demo-window">
    <div class="coaching-demo-window-top"><span class="coaching-demo-mark" aria-hidden="true">↝</span><strong>Leadership reflection</strong><span>A workplace situation</span></div>
    <div class="coaching-demo-workspace">
      <aside class="coaching-demo-context" aria-label="Conversation context">
        <p class="coaching-demo-small-label">Keep in view</p>
        <h3>Giving feedback</h3>
        <p>Make space for another perspective while being clear about what matters.</p>
        <div class="coaching-demo-context-sources">
          <span>Assessment context</span>
          <span>Relevant material</span>
          <span>The situation you bring</span>
        </div>
        <p class="coaching-demo-context-note">Context informs the conversation. The leader decides what to take forward.</p>
      </aside>
      <fieldset class="coaching-demo-conversation">
        <legend>Explore the example</legend>
        <input type="radio" name="coaching-example-step" id="coaching-demo-step-1" checked>
        <input type="radio" name="coaching-example-step" id="coaching-demo-step-2">
        <input type="radio" name="coaching-example-step" id="coaching-demo-step-3">
        <div class="coaching-demo-step-labels">
          <label for="coaching-demo-step-1"><span>01</span>Bring a situation</label>
          <label for="coaching-demo-step-2"><span>02</span>Reflect with context</label>
          <label for="coaching-demo-step-3"><span>03</span>Choose an action</label>
        </div>
        <div class="coaching-demo-scenes">
          <div class="coaching-demo-scene coaching-demo-scene-1">
            <div class="coaching-demo-message coaching-demo-message-person"><span>You</span><p>I need to give a colleague some difficult feedback. I don’t want them to feel dismissed.</p></div>
            <div class="coaching-demo-message coaching-demo-message-coach"><span>Coach</span><p>What would you like them to understand, and what would you like to understand from them?</p></div>
            <p class="coaching-demo-pause">Start with what is happening, in your own words.</p>
          </div>
          <div class="coaching-demo-scene coaching-demo-scene-2">
            <div class="coaching-demo-message coaching-demo-message-person"><span>You</span><p>I tend to move straight to a solution.</p></div>
            <div class="coaching-demo-message coaching-demo-message-coach"><span>Coach</span><p>What might change if you first asked how they see the situation?</p></div>
            <p class="coaching-demo-pause">A reflective question opens another perspective.</p>
          </div>
          <div class="coaching-demo-scene coaching-demo-scene-3">
            <div class="coaching-demo-message coaching-demo-message-person"><span>You</span><p>I’ll begin by asking for their perspective, then share one specific example.</p></div>
            <div class="coaching-demo-message coaching-demo-message-coach"><span>Coach</span><p>What will help you notice whether that opening creates room for a useful discussion?</p></div>
            <div class="coaching-demo-action"><span class="coaching-demo-small-label">A next step to try · chosen by the leader</span><p>Ask for their perspective before explaining mine.</p></div>
          </div>
        </div>
      </fieldset>
    </div>
  </div>
  <p class="coaching-demo-footnote">A shared context, a personal conversation, and a next step the leader chooses.</p>
</figure>
