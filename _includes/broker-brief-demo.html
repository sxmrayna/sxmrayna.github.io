<figure class="broker-brief-demo" aria-labelledby="broker-demo-caption">
  <figcaption id="broker-demo-caption">Conceptual briefing · fictional information</figcaption>
  <div class="broker-demo-window">

    <div class="broker-demo-workspace">
      <aside class="broker-demo-context" aria-label="Example preparation request and supporting context">
        <div class="broker-demo-request">
          <p class="broker-demo-label">Describe the need</p>
          <p>Help me prepare questions about recent industry topics for an upcoming broker visit.</p>
        </div>
        <div class="broker-demo-monitoring">
          <p class="broker-demo-label"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false"><path d="M16.5 8a6.5 6.5 0 1 0-.5 5.4M16.5 3.8V8h-4.2"/></svg>Recurring monitoring</p>

          <article class="broker-demo-source" id="broker-demo-source-a" tabindex="-1">
            <span class="broker-demo-source-id">A</span>
            <div><h3>Industry note</h3><p>A fictional article discusses digital servicing for brokers.</p></div>
          </article>
          <article class="broker-demo-source" id="broker-demo-source-b" tabindex="-1">

        </div>

      </aside>
      <div class="broker-demo-report">

        <section class="broker-demo-report-section" aria-labelledby="broker-demo-changed">

          <div><h4 id="broker-demo-changed">What changed?</h4><p>Two reference items raise topics around digital servicing and contact routes. <a class="broker-demo-citation" href="#broker-demo-source-a" aria-label="Read fictional source A">A</a> <a class="broker-demo-citation" href="#broker-demo-source-b" aria-label="Read fictional source B">B</a></p></div>
        </section>
        <section class="broker-demo-report-section" aria-labelledby="broker-demo-relevant">
          <span class="broker-demo-section-number" aria-hidden="true">02</span>

          <span class="broker-demo-section-number" aria-hidden="true">03</span>

        <div class="broker-demo-review">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path d="M12 3 3.5 6.5v5c0 4.5 3.7 7.8 8.5 9.5 4.8-1.7 8.5-5 8.5-9.5v-5L12 3Z"/><path d="m8 11.8 2.6 2.6 5.2-5.2"/></svg>
          <p><strong>Review, then prepare.</strong><span>Check the sources and choose the questions worth exploring.</span></p>
        </div>
      </div>
    </div>
  </div>
